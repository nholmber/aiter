reporting:
  type: mlflow
  args:
    uri: databricks
    experiment_name: /amd--GLM-5.2-MXFP4
    run_name: 20260804_vllm_tp4_glm52_m16_pr1234_baseline
    tags:
      oob_phantom: true
      public: false
      framework: vllm
      variant: m16_pr1234_baseline
      m16_private_grouped: false
server:
  type: docker
  stop_between_runs: false
  args:
    image: amdsiloai/vllm-private:vllm_69715823_aiter_4a1cc77_glm52_production_tp4_pr1_pr2_pr3_pr4_pr50008
    environment:
      SAFETENSORS_FAST_GPU: "1"
      HF_TOKEN: ${HF_TOKEN}
      VLLM_ROCM_AITER_MOE_DISPATCH_POLICY: "0"
      VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
      VLLM_ROCM_USE_AITER_MHA: "0"
      VLLM_ROCM_USE_AITER_SPARSE_INDEXER: "1"
      VLLM_ROCM_USE_AITER_FP4BMM: "0"
      AITER_USE_FLYDSL_MOE_SORTING: "1"
      AITER_FP8_PAGED_MQA_LOGITS_FLYDSL: "0"
      AITER_GLM52_M16_PRIVATE_GROUPED: "0"
      HIP_VISIBLE_DEVICES: "4,5,6,7"
    command: vllm serve amd/GLM-5.2-MXFP4
    entrypoint: ""
    args:
      async_scheduling: true
      host: 0.0.0.0
      port: 8033
      tensor_parallel_size: 4
      trust_remote_code: true
      enable_log_requests: false
      max_num_seqs: 16
      block_size: 64
      gpu_memory_utilization: 0.85
      max_model_len: 258048
      kv_cache_dtype: fp8
      no_enable_prefix_caching: true
      compilation_config: '{"pass_config": {"fuse_rope_kvcache_cat_mla": true}, "use_inductor_graph_partition": true}'
    network_mode: host
    ipc_mode: host
    volumes:
      - ${HOST_HF_HUB_CACHE}:/root/.cache/huggingface/hub
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    security_opt:
      - seccomp=unconfined
    group_add:
      - video
    shm_size: "128G"
benchmarks:
  - type: sglang_bench_serve
    record_metrics: true
    args:
      backend: vllm
      dataset-name: random
      host: localhost
      port: 8033
      model: amd/GLM-5.2-MXFP4
      ready-check-timeout-sec: 7200
      request-rate: inf
      random-range-ratio: 0.8
    sweep_config:
      - {random-input-len: 1024, random-output-len: 1024, max-concurrency: 16, warmup-requests: 16, seed: 9, num-prompts: 96}
      - {random-input-len: 8192, random-output-len: 1024, max-concurrency: 16, warmup-requests: 16, seed: 11, num-prompts: 96}
      - {random-input-len: 60000, random-output-len: 600, max-concurrency: 16, warmup-requests: 16, seed: 31, num-prompts: 96}
